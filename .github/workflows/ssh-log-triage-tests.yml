name: SSH log triage tests

on:
  push:
    paths:
      - 'tools/ssh-log-triage/**'
      - '.github/workflows/ssh-log-triage-tests.yml'
  pull_request:
    paths:
      - 'tools/ssh-log-triage/**'
      - '.github/workflows/ssh-log-triage-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tools/ssh-log-triage -p 'test_*.py' -v
